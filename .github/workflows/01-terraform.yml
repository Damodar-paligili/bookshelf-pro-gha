name: 01 - Terraform Infrastructure Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ROOT-terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform:
    name: Terraform Automation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ROOT-terraform/envs

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.8.0

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Auto-Bootstrap S3 & DynamoDB Backend
      id: bootstrap
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        BUCKET_NAME="bookshelf-tf-state-${ACCOUNT_ID}"
        DDB_TABLE="bookshelf-tf-locks"
        REGION="${{ secrets.AWS_REGION }}"

        echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
        echo "ddb_table=$DDB_TABLE" >> $GITHUB_OUTPUT

        # Check if S3 bucket exists; if not, create it
        if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
          echo "Creating S3 bucket: $BUCKET_NAME"
          if [ "$REGION" = "us-east-1" ]; then
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$REGION"
          else
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$REGION" \
              --create-bucket-configuration LocationConstraint="$REGION"
          fi
          aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
        else
          echo "S3 bucket $BUCKET_NAME already exists."
        fi

        # Check if DynamoDB table exists; if not, create it
        if ! aws dynamodb describe-table --table-name "$DDB_TABLE" --region "$REGION" 2>/dev/null; then
          echo "Creating DynamoDB table: $DDB_TABLE"
          aws dynamodb create-table \
            --table-name "$DDB_TABLE" \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region "$REGION"
          aws dynamodb wait table-exists --table-name "$DDB_TABLE" --region "$REGION"
        else
          echo "DynamoDB table $DDB_TABLE already exists."
        fi

    - name: Terraform Format
      run: terraform fmt

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ steps.bootstrap.outputs.bucket_name }}" \
          -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.ddb_table }}" \
          -backend-config="region=${{ secrets.AWS_REGION }}"

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      run: terraform plan -var-file="terraform.tfvars" -out=tfplan

    - name: Terraform Apply
      if: github.event.inputs.action == 'apply' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      run: terraform apply -auto-approve tfplan

    - name: Terraform Destroy
      if: github.event.inputs.action == 'destroy'
      run: terraform destroy -var-file="terraform.tfvars" -auto-approve
